baseURL = 'http://stephan.fm'
languageCode = 'en-us'
title = 'stephan.fm'
theme = 'nojs'


[params]
description = "Stephan Bridger's blog"

[menus]
  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 1

  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 2

  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 3

[markup]
  [markup.highlight]
    noClasses = false

  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[permalinks]
posts = "/posts/:year/:month/:day/:slugorcontentbasename/"

